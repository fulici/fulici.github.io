# Site
title: 佛狸祠
subtitle: 把学习、思考与实践，慢慢写下来
description: 佛狸祠的个人博客，记录技术、学习与生活。
keywords:
  - 佛狸祠
  - 个人博客
  - 技术与生活
author: 佛狸祠
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://fulici.github.io
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: "  "
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ""

# Home page setting
index_generator:
  path: ""
  per_page: 8
  order_by: -date

default_category: 未分类
category_map:
tag_map:

# Metadata
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
include:
exclude:
ignore:

# Extensions
theme: fluid

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true

# Deployment
deploy:
  type: git
  repo: https://github.com/fulici/fulici.github.io.git
  branch: main
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
